[project]
name = "kairos"
version = "0.1.0"
description = "Multi-tenant agent platform for financial research"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "RUF",
    "ASYNC",       # async antipatterns
    "S",           # bandit
]
ignore = [
    "E501",        # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is the point of a test

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires a live database or Redis",
]

# ---------------------------------------------------------------------------
# Architecture boundaries
#
# The domain core must not know what framework serves it or what database
# stores it. Convention does not hold this line; CI does.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "kairos"

[[tool.importlinter.contracts]]
name = "Core stays free of frameworks"
type = "forbidden"
source_modules = ["kairos.core"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "redis",
    "httpx",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
    "kairos.runtime",
    "kairos.api",
    "kairos.adapters",
    "kairos.core",
]
