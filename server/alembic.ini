[alembic]
# Inside the package rather than beside it, so that a wheel carries its own
# migrations. A deployment that installs the package and cannot find the
# migrations that match it has to guess at the schema version.
script_location = kairos/migrations
prepend_sys_path = .
version_path_separator = os

# The URL is supplied by migrations/env.py from application settings, so that
# there is one source of truth for where the database is. Leaving it here as
# well is how the two drift and someone migrates the wrong database.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
